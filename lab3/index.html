<!DOCTYPE html>
<html>

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link href="css/footer.css" rel="stylesheet" type="text/css">
   <title> Sign Up Page </title>
</head>

<body>
   <div class="container align-items-center">
      <h1> Sign Up Form</h1>
      <form id="signupForm" action="welcome.html">
         <div class="container p-0">
            <div class="row">
               <div class="mb-3 col-sm">
                  <label for="fName" class="form-label">First Name:</label>
                  <input type="text" class="form-control" id="fName" name="fName">
               </div>
               <div class="mb-3 col-sm">
                  <label for="lName" class="form-label">Last Name:</label>
                  <input type="text" class="form-control" id="lName" name="lName">
               </div>
               <div class="mb-3 col-auto">
                  <div class="form-label">Gender:</div>
                  <div class="form-check form-check-inline">
                     <input class="form-check-input" type="radio" name="gender" id="genderM" value="m">
                     <label class="form-check-label" for="genderM">Male</label>
                  </div>
                  <div class="form-check form-check-inline">
                     <input class="form-check-input" type="radio" name="gender" id="genderF" value="f">
                     <label class="form-check-label" for="genderF">Female</label>
                  </div>
               </div>
            </div>
            <div class="alert d-none small" role="alert" id="nameError"></div>

         </div>




         <div class="container-fluid p-0">
            <div class="row">
               <div class=" col-sm mb-3">
                  <label for="zip" class="form-label">Zip Code:</label>
                  <input type="text" class="form-control" id="zip" name="zip">
               </div>
               <div class="col border rounded m-2 mb-3">
                  <p class="mb-1">City: <span id="city"></span></p>
                  <p class="mb-1">Latitude: <span id="latitude"></span></p>
                  <p class="mb-1">Longitude: <span id="longitude"></span></p>
               </div>
            </div>
            <div class="alert alert-danger d-none small" role="alert" id="zipError"></div>
         </div>

         <div class="container p-0">
            <div class="row">
               <div class="mb-3 col">
                  <label for="state" class="form-label">State:</label>
                  <select class="form-select" id="state" name="state">
                     <option value="">Loading states...</option>
                  </select>
               </div>
               <div class="mb-3 col">
                  <label for="county" class="form-label">Select a County:</label>
                  <select class="form-select" id="county" name="county"></select>
               </div>
            </div>
            <div class="alert d-none small" role="alert" id="stateCountyError"></div>
         </div>

         <div class="mb-3">
            <label for="username" class="form-label">Desired Username:</label>
            <input type="text" class="form-control" id="username" name="username">
            <div class="alert d-none small" role="alert" id="usernameError"></div>
         </div>

         <div class="container p-0">
            <div class="row">
               <div class="mb-3 col-sm">
                  <label for="password" class="form-label">Password:</label>
                  <input type="password" class="form-control" id="password" name="password">
                  <span id="passSuggest" class="form-text"></span>
               </div>
               <div class="mb-3 col-sm">
                  <label for="passwordAgain" class="form-label">Type Password Again:</label>
                  <input type="password" class="form-control" id="passwordAgain" name="passwordAgain">
               </div>
           <div class="alert d-none small" role="alert" id="passwordError"></div>
            </div>
         </div>

         <button type="submit" class="btn btn-primary">Sign up!</button>
      </form>
   </div>
   <footer>
      <div class="logo"></div>
      <div>
         <p>&copy; 2026 Eric Holm. All rights reserved. This site is for academic purposes only.</p>
         <p>CST 336 Internet Programming</p>
      </div>
   </footer>
   <script src="js/script.js"></script>
</body>

</html>
